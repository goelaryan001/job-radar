# ---------------------------------------------------------------------------
# Where the tracker looks.
#
# feeds: whole-market sources (no company list needed)
#   simplify, speedyapply : community new-grad lists on GitHub (cover Google, Meta, Apple + thousands more)
#   amazon, microsoft, netflix : Big Tech careers sites read directly
#   handshake : your Handshake saved-search alert emails (needs Gmail secrets)
#
# companies: one line per company, grouped by hiring platform.
#   id   = the company's board name on that platform. Find it in the company's job URL, e.g.
#          job-boards.greenhouse.io/<id>/... , jobs.lever.co/<id>/... , jobs.ashbyhq.com/<id>/...
#          Workday: <tenant>.wdN/<site> from https://<tenant>.wdN.myworkdayjobs.com/<site>
#   tier = established | startup   (Big Tech is detected automatically)
#
# If an id is wrong, that company shows up under "Recent errors" at the bottom of the
# digest email. Fix or delete the line; nothing else breaks.
# ---------------------------------------------------------------------------

feeds: [simplify, speedyapply, amazon, microsoft, netflix, handshake]


<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #17171a; --muted: #6b6b72; --line: #e6e4de;
    --accent: #1f5fbf; --warn: #a3342e; --chip: #efeee9; --done: #9a9aa0;
    --de: #0b6e4f; --mle: #6a3fb5; --ds: #b5541c; --da: #a8326e; --swe: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --card: #1c1c21; --ink: #ececef; --muted: #9a9aa3; --line: #2c2c33;
            --accent: #7aa7ff; --warn: #ff8a80; --chip: #26262d; --done: #5d5d66;
            --de: #3fbf8f; --mle: #a78bfa; --ds: #f0965a; --da: #f07fb6; --swe: #7aa7ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 60px; }
  header h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 6px; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 8px;
                font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  input[type=search] { flex: 1 1 200px; min-width: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
                       background: var(--card); color: var(--ink); font: inherit; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
          padding: 4px 11px; font-size: 12.5px; cursor: pointer; user-select: none; }
  .chip.on { color: var(--ink); border-color: var(--ink); }
  .toggles { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
  .toggles label { cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 8px; }
  h2.warn { color: var(--warn); }
  .job { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; align-items: start; background: var(--card);
         border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .job input { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  .job a.t { color: var(--ink); font-weight: 600; text-decoration: none; }
  .job a.t:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .skills { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .visa { color: var(--warn); font-size: 12px; margin-top: 3px; }
  .tag { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .y27 { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: var(--de);
         border: 1px solid var(--de); white-space: nowrap; margin-left: 6px; vertical-align: 2px; }
  .when { color: var(--muted); font-size: 12px; text-align: right; margin-top: 4px; white-space: nowrap; }
  .job.done { opacity: .55; }
  .job.done a.t { text-decoration: line-through; color: var(--done); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  @media (max-width: 560px) {
    .job { grid-template-columns: 24px 1fr; }
    .job .right { grid-column: 2; display: flex; gap: 8px; align-items: center; }
    .y27 { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: var(--de);
         border: 1px solid var(--de); white-space: nowrap; margin-left: 6px; vertical-align: 2px; }
  .when { margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job Radar</h1>
    <p id="sub"></p>
  </header>

  <div class="bar">
    <div class="seg" id="range">
      <button data-h="24" class="on">Last 24h</button>
      <button data-h="72">3 days</button>
      <button data-h="168">7 days</button>
      <button data-h="99999">All</button>
    </div>
    <input type="search" id="q" placeholder="Search title, company, location…">
  </div>
  <div class="chips" id="roles"></div>
  <div class="toggles">
    <label><input type="checkbox" id="hideApplied"> Hide applied</label>
    <label><input type="checkbox" id="hideVisa"> Hide sponsorship concerns</label>
    <label><input type="checkbox" id="only27"> Only jobs that say 2027 grads</label>
  </div>
  <div id="list"></div>
</div>

<script>
const DATA = /*__DATA__*/null || {generated: Date.now()/1000, jobs: []};
const TIERS = [["maang","Big Tech (MAANG)"],["established","Established companies"],["other","Other companies"],["startup","Startups"]];
const ROLE_VAR = {"Data Engineer":"--de","ML Engineer":"--mle","Data Scientist":"--ds","Data Analyst":"--da","Software Engineer":"--swe"};

// Applied state lives in this browser only.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let applied = new Set(store.get("applied", []));
let state = { hours: 24, q: "", roles: new Set(), hideApplied: store.get("hideApplied", false), hideVisa: store.get("hideVisa", false), only27: store.get("only27", false) };

const now = Date.now() / 1000;
const fresh = j => j.posted || j.found;
function ago(ts) {
  const s = Math.max(0, now - ts);
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.getElementById("sub").textContent =
  `${DATA.jobs.length} matching jobs in the last 14 days · updated ${new Date(DATA.generated*1000).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"})}`;

const roleNames = [...new Set(DATA.jobs.map(j => j.role))].sort();
const rolesEl = document.getElementById("roles");
rolesEl.innerHTML = roleNames.map(r => `<span class="chip" data-r="${esc(r)}">${esc(r)}</span>`).join("");
rolesEl.onclick = e => {
  const r = e.target.dataset.r; if (!r) return;
  state.roles.has(r) ? state.roles.delete(r) : state.roles.add(r);
  e.target.classList.toggle("on"); render();
};
document.getElementById("range").onclick = e => {
  if (!e.target.dataset.h) return;
  document.querySelectorAll("#range button").forEach(b => b.classList.toggle("on", b === e.target));
  state.hours = +e.target.dataset.h; render();
};
document.getElementById("q").oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
for (const id of ["hideApplied", "hideVisa", "only27"]) {
  const el = document.getElementById(id);
  el.checked = state[id];
  el.onchange = () => { state[id] = el.checked; store.set(id, el.checked); render(); };
}

function card(j) {
  const done = applied.has(j.id);
  const when = j.posted ? "posted " + ago(j.posted) : "found " + ago(j.found);
  return `<div class="job${done ? " done" : ""}">
    <input type="checkbox" data-id="${esc(j.id)}" ${done ? "checked" : ""} title="Mark as applied">
    <div>
      <a class="t" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>${j.timing === "2027" ? '<span class="y27">2027 grads</span>' : ""}
      <div class="meta">${esc(j.company)}${j.location ? " · " + esc(j.location.slice(0, 80)) : ""}</div>
      ${j.skills.length ? `<div class="skills">matches: ${esc(j.skills.join(", "))}</div>` : ""}
      ${j.visa ? `<div class="visa">⚠ ${esc(j.visa.slice(0, 180))}</div>` : ""}
    </div>
    <div class="right">
      <span class="tag" style="background:var(${ROLE_VAR[j.role] || "--swe"})">${esc(j.resume)}</span>
      <div class="when">${when}</div>
    </div>
  </div>`;
}

function render() {
  const cutoff = now - state.hours * 3600;
  const jobs = DATA.jobs.filter(j =>
    fresh(j) >= cutoff &&
    (!state.roles.size || state.roles.has(j.role)) &&
    (!state.hideApplied || !applied.has(j.id)) &&
    (!state.hideVisa || !j.visa) &&
    (!state.only27 || j.timing === "2027") &&
    (!state.q || (j.title + " " + j.company + " " + j.location).toLowerCase().includes(state.q))
  ).sort((a, b) => fresh(b) - fresh(a));
  const flagged = jobs.filter(j => j.visa);
  const undated = DATA.undatedInMain ? [] : jobs.filter(j => !j.visa && j.timing !== "2027");
  const clean = jobs.filter(j => !j.visa && !undated.includes(j));
  let html = "";
  for (const [t, label] of TIERS) {
    const g = clean.filter(j => (j.tier || "other") === t);
    if (g.length) html += `<h2>${label} · ${g.length}</h2>` + g.map(card).join("");
  }
  if (undated.length) html += `<h2>Entry level, start date not stated · ${undated.length}</h2>` + undated.map(card).join("");
  if (flagged.length) html += `<h2 class="warn">Sponsorship concerns · ${flagged.length}</h2>` + flagged.map(card).join("");
  document.getElementById("list").innerHTML = html || `<div class="empty">No jobs match these filters.</div>`;
}
document.getElementById("list").onchange = e => {
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? applied.add(id) : applied.delete(id);
  store.set("applied", [...applied]); render();
};
render();
</script>
</body>
</html>
